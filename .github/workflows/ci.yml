name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  commit-msg:
    name: Verify Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit messages
        run: |
          # Check only the most recent commit (HEAD) being pushed
          # Previous commits are assumed to have passed local hook
          msg=$(git log -1 --format='%B' HEAD)
          echo "Verifying commit: $msg"

          if ! echo "$msg" | grep -qE '\[(task|issue|inter-review): [a-f0-9-]+\]'; then
            echo "ERROR: Commit missing task/issue/inter-review ID"
            echo "Found: $msg"
            exit 1
          fi

          if ! echo "$msg" | grep -qE '\[Agent: (S-|G-)[a-zA-Z0-9_-]+\]'; then
            echo "ERROR: Commit missing [Agent:] tag"
            echo "Found: $msg"
            exit 1
          fi

          echo "Commit verified successfully"

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build --workspace=auto-reflect

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build --workspace=auto-reflect

      - name: Build main package
        run: npm run build

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/NezhaCore.js && echo "Build successful"
