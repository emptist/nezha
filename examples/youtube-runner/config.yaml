project:
  name: "youtube-runner"
  description: "AI-powered YouTube channel management"
  version: "1.0.0"

nezha:
  database_url: "${DATABASE_URL}"
  skills_table: "skills"
  memory_dir: ".tmp/nezha-memory"

youtube:
  channel_id: "${YOUTUBE_CHANNEL_ID}"
  credentials_file: "credentials.json"
  token_file: "token.json"
  
video_creation:
  output_dir: "output/videos"
  temp_dir: "temp"
  default_format: "mp4"
  max_duration_minutes: 15

upload:
  default_privacy: "private"
  default_category: "22"
  tags:
    - "AI"
    - "Automation"
  schedule:
    enabled: true
    preferred_times:
      - "09:00"
      - "15:00"
      - "20:00"

analytics:
  review_interval_hours: 24
  metrics:
    - views
    - likes
    - comments
    - watch_time
  alert_thresholds:
    low_views: 100
    high_dislike_ratio: 0.3

skills:
  - name: "video-creation"
    enabled: true
  - name: "video-upload"
    enabled: true
  - name: "analytics-review"
    enabled: true

logging:
  level: "info"
  file: "logs/youtube-runner.log"
